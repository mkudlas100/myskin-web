name: Stažení obrázků z původního webu

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/images.json
      - scripts/fetch-images.mjs

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stáhnout obrázky
        run: node scripts/fetch-images.mjs
      - name: Uložit do repozitáře
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add src/assets/img
          if git diff --cached --quiet; then
            echo "Žádné nové obrázky."
          else
            git commit -m "Obrázky z původního webu (automaticky staženo)"
            git push
          fi
